<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#14181c">
<meta name="description" content="KRAEFEGG M.O. — Tech-AI & Engineering Solutions · Mining · Energy · Environmental · Sistema Multiagente">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='18' fill='%2314181c'/><text x='50' y='68' font-size='58' text-anchor='middle' fill='%23c0392b' font-family='Arial'>M</text></svg>">
<link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='18' fill='%2314181c'/><text x='50' y='68' font-size='58' text-anchor='middle' fill='%23c0392b' font-family='Arial'>M</text></svg>">
<title>KRAEFEGG M.O. — Tech-AI & Engineering Solutions</title>
<style>
/* ============================================================
   KRAEFEGG M.O. — Tech-AI & Engineering Solutions (Mining · Energy · Environmental)
   Estética enterprise (sem game/HUD/neon). Digital Twin isométrico.
   Paleta: metalizado preto/carvão/cinza/branco + vermelho (accent #c0392b).
   ============================================================ */
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --carvao-950:#0d0f11; --carvao-900:#14181c; --carvao-800:#1d2227; --carvao-700:#272d33;
  --grafite-600:#39424b; --grafite-500:#4d565f; --cinza-400:#6b7681; --cinza-300:#9aa4ad;
  --cinza-200:#c3c9cf; --cinza-100:#e6eaee; --branco:#f7f9fb;
  --azul-petroleo:#c0392b; --azul-profundo:#a93226; --ciano-discreto:#8a2d22; --ciano-claro:#e07a70;
  --verde-operacional:#b03a2e; --verde-claro:#d0594c; --ambar:#c65c4f; --amb-claro:#e07a70;
  --vermelho:#c0392b; --sombra:0 12px 30px rgba(10,12,14,.22);
  --borda:#2a3037; --borda-suave:#333a42;
  --fonte:'Segoe UI',system-ui,-apple-system,sans-serif;
}
html,body{height:100%}
body{font-family:var(--fonte);color:var(--carvao-900);background:
  radial-gradient(1200px 600px at 12% -10%, rgba(27,77,94,.10), transparent 60%),
  radial-gradient(900px 500px at 100% 0%, rgba(20,58,72,.08), transparent 55%),
  linear-gradient(180deg,#eef1f4,#e7ebef);
  font-size:14px;line-height:1.5}
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.5;
  background:
    linear-gradient(rgba(27,77,94,.035) 1px, transparent 1px),
    linear-gradient(90deg, rgba(27,77,94,.035) 1px, transparent 1px);
  background-size:46px 46px,46px 46px;
  -webkit-mask-image:radial-gradient(ellipse 80% 60% at 50% 20%, #000 20%, transparent 85%);
          mask-image:radial-gradient(ellipse 80% 60% at 50% 20%, #000 20%, transparent 85%)}
#topo,.painel,.kpi-card,.acoes-rapidas,#lateral aside,.barra-status{position:relative;z-index:1}

/* ===== Banner + logo ===== */
.banner-hero{position:relative;border-radius:12px;overflow:hidden;margin-bottom:18px;box-shadow:var(--sombra);border:1px solid var(--borda)}
.banner-hero img{display:block;width:100%;height:auto;min-height:120px;object-fit:cover}
.banner-overlay{position:absolute;inset:0;display:flex;align-items:flex-end;justify-content:space-between;padding:18px 22px;
  background:linear-gradient(180deg,transparent 20%,rgba(11,17,22,.72) 100%)}
.banner-overlay h1{color:#fff;font-size:26px;font-weight:700;letter-spacing:-.3px;text-shadow:0 2px 14px rgba(0,0,0,.5)}
.banner-overlay p{color:rgba(255,255,255,.85);font-size:13px;margin-top:3px}
.banner-chip{display:inline-flex;align-items:center;gap:7px;padding:7px 14px;border-radius:30px;background:rgba(20,24,28,.72);border:1px solid rgba(255,255,255,.18);color:#fff;font-size:12px;font-weight:600;backdrop-filter:blur(3px)}
.banner-chip .dot{width:8px;height:8px}

/* ===== Header ===== */
#topo{position:sticky;top:0;z-index:40;background:linear-gradient(180deg,#ffffff,#f9fbfc);border-bottom:1px solid var(--borda);box-shadow:0 2px 10px rgba(15,20,26,.05)}
.topo-inner{max-width:1440px;margin:0 auto;display:flex;align-items:center;gap:24px;padding:0 20px;height:60px}
.marca{display:flex;align-items:center;gap:12px;min-width:230px;border-right:1px solid var(--borda-suave);padding-right:20px}
.logo-img{width:38px;height:38px;border-radius:7px;object-fit:cover;flex-shrink:0}
.marca b{font-size:16px;font-weight:700;color:var(--carvao-900);letter-spacing:-.2px}
.marca b span{color:var(--azul-petroleo)}
.marca small{display:block;font-size:10px;color:var(--cinza-400);letter-spacing:1.2px;text-transform:uppercase;font-weight:600;margin-top:1px}
nav{flex:1;display:flex;gap:2px;align-items:center}
nav button{position:relative;border:0;background:transparent;color:var(--grafite-500);font-size:13px;font-weight:600;padding:8px 12px;border-radius:6px;cursor:pointer;transition:.15s;white-space:nowrap}
nav button:hover{color:var(--azul-petroleo);background:#f2f5f7}
nav button.ativo{color:var(--azul-petroleo);background:#eaf1f4}
nav button.ativo::after{content:'';position:absolute;left:12px;right:12px;bottom:0;height:2px;background:var(--azul-petroleo);border-radius:2px}
.topo-acoes{display:flex;align-items:center;gap:8px;min-width:200px;justify-content:flex-end}
.icon-btn{width:34px;height:34px;border:1px solid var(--borda);background:#fff;border-radius:7px;display:grid;place-items:center;cursor:pointer;color:var(--grafite-500);transition:.15s;font-size:16px}
.icon-btn:hover{background:#f2f5f7;color:var(--azul-petroleo)}
.icon-btn .badge{position:absolute;top:-3px;right:-3px;width:16px;height:16px;border-radius:50%;background:var(--ambar);color:#fff;font-size:9px;display:grid;place-items:center;font-weight:700}
#cta-perfil{display:flex;align-items:center;gap:9px;border:1px solid var(--borda);border-radius:8px;padding:4px 10px 4px 4px;background:#fff;cursor:pointer;transition:.15s}
#cta-perfil:hover{border-color:var(--cinza-300)}
.avatar{width:34px;height:34px;border-radius:7px;background:var(--azul-petroleo);color:#fff;display:grid;place-items:center;font-weight:700;font-size:13px}
#cta-perfil b{font-size:12.5px;color:var(--carvao-900);font-weight:600}
#cta-perfil small{display:block;font-size:10px;color:var(--cinza-400);text-transform:uppercase;letter-spacing:.5px}

/* ===== Layout ===== */
#layout{max-width:1440px;margin:0 auto;padding:20px;display:grid;grid-template-columns:230px 1fr;gap:20px}
#lateral{min-width:230px}
#conteudo{min-width:0}

/* Barra lateral */
#lateral aside{position:sticky;top:80px;background:#fff;border:1px solid var(--borda);border-radius:10px;overflow:hidden}
.menu-titulo{padding:12px 16px;font-size:11px;font-weight:700;color:var(--cinza-400);text-transform:uppercase;letter-spacing:1.2px;border-bottom:1px solid var(--borda-suave)}
.menu-item{display:flex;align-items:center;gap:10px;padding:11px 16px;font-size:13.5px;color:var(--grafite-500);font-weight:600;cursor:pointer;border-left:3px solid transparent;transition:.15s;background:#fff}
.menu-item:hover{background:#f6f8fa;color:var(--carvao-900)}
.menu-item.ativo{background:#eef3f6;color:var(--azul-petroleo);border-left-color:var(--azul-petroleo);font-weight:700}
.mi-ico{width:18px;text-align:center;color:var(--grafite-500)}
.menu-item.ativo .mi-ico{color:var(--azul-petroleo)}

/* Ações rápidas */
.acoes-rapidas{margin-top:16px;background:#fff;border:1px solid var(--borda);border-radius:10px;padding:14px}
.acoes-rapidas h3{font-size:12px;color:var(--cinza-400);text-transform:uppercase;letter-spacing:1.2px;margin-bottom:10px;font-weight:700}
.acoes-rapidas button{display:flex;align-items:center;gap:8px;width:100%;margin-bottom:6px;padding:8px 10px;border:1px solid var(--borda-suave);border-radius:7px;background:#f9fafb;font-size:12.5px;font-weight:600;color:var(--grafite-500);cursor:pointer;transition:.15s;text-align:left}
.acoes-rapidas button:hover{background:#eef3f6;color:var(--azul-petroleo);border-color:var(--cinza-300)}

/* ===== Painel executivo ===== */
.page-titulo{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.page-titulo h1{font-size:22px;font-weight:700;color:var(--carvao-900);letter-spacing:-.3px}
.page-titulo p{font-size:13px;color:var(--cinza-400);margin-top:2px}
.barra-status{display:flex;gap:8px;align-items:center;background:#fff;border:1px solid var(--borda);border-radius:8px;padding:6px 12px;font-size:12px;color:var(--grafite-500)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.dot.ok{background:var(--verde-operacional)}
.dot.alerta{background:var(--ambar)}
.chip{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:600}
.chip.verde{background:#e8f3ec;color:var(--verde-operacional)}
.chip.azul{background:#e8f1f4;color:var(--azul-petroleo)}
.chip.ambar{background:#fbf1e2;color:var(--ambar)}
.chip.vermelho{background:#f9e7e4;color:var(--vermelho)}

.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px}
.kpi-card{background:#fff;border:1px solid var(--borda);border-radius:10px;padding:16px 18px;position:relative;overflow:hidden}
.kpi-card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--accent,var(--azul-petroleo))}
.kpi-label{font-size:11px;font-weight:700;color:var(--cinza-400);text-transform:uppercase;letter-spacing:1.2px;margin-bottom:6px}
.kpi-val{font-size:30px;font-weight:700;color:var(--carvao-900);letter-spacing:-.5px;line-height:1.1}
.kpi-sub{font-size:12px;color:var(--grafite-500);margin-top:4px}
.kpi-sub .tend{font-weight:700}
.kpi-sub .tend.sobe{color:var(--verde-operacional)}
.kpi-sub .tend.desc{color:var(--vermelho)}

.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:20px}
.painel{background:#fff;border:1px solid var(--borda);border-radius:10px;overflow:hidden}
.painel-titulo{padding:14px 18px;border-bottom:1px solid var(--borda-suave);display:flex;align-items:center;justify-content:space-between}
.painel-titulo h2{font-size:15px;font-weight:700;color:var(--carvao-900)}
.painel-titulo span{font-size:12px;color:var(--cinza-400)}
.painel-corpo{padding:16px 18px}

/* ===== Digital Twin isométrico ===== */
#cena-twin{background:linear-gradient(180deg,var(--carvao-800),var(--carvao-950));border-radius:10px;position:relative;overflow:hidden;min-height:380px}
#cena-twin svg{display:block;width:100%;height:auto}
.twin-legenda{position:absolute;left:14px;bottom:12px;color:var(--cinza-200);font-size:11px;letter-spacing:.5px;opacity:.7}
.twin-hud{position:absolute;top:14px;right:14px;background:rgba(20,24,28,.72);border:1px solid rgba(255,255,255,.08);border-radius:8px;padding:10px 12px;color:var(--cinza-200);font-size:12px;backdrop-filter:blur(4px)}
.twin-hud b{color:#fff;display:block;font-size:16px;font-weight:700}
.twin-hud span{font-size:10px;text-transform:uppercase;letter-spacing:1px;color:var(--cinza-400)}
.dept-hover{cursor:pointer}
.dept-hover .dept-tag{opacity:0;fill:rgba(20,24,28,.78);stroke:#fff;stroke-width:0;transition:.15s}
.dept-hover .lbl-txt{opacity:0;transition:.15s}
.dept-hover:hover .dept-tag,.dept-hover.ativo .dept-tag,.dept-hover:hover .lbl-txt,.dept-hover.ativo .lbl-txt{opacity:1}

/* ===== Tabelas ===== */
table{width:100%;border-collapse:collapse}
th{font-size:11px;font-weight:700;color:var(--cinza-400);text-transform:uppercase;letter-spacing:.8px;text-align:left;padding:10px 12px;border-bottom:1px solid var(--borda)}
td{padding:11px 12px;border-bottom:1px solid var(--borda-suave);font-size:13px;color:var(--grafite-600);vertical-align:middle}
tr:last-child td{border-bottom:0}
tr:hover td{background:#f8fafb}
tr.linha-ativa td{background:#e6f1f5;box-shadow:inset 3px 0 0 var(--azul-petroleo)}
.cell-id{font-weight:700;color:var(--carvao-900)}
.progresso{border-radius:20px;overflow:hidden;height:6px;background:#e5e9ec;width:100px;display:inline-block;vertical-align:middle}
.progresso i{display:block;height:100%;background:var(--azul-petroleo)}
.pct{font-weight:700;color:var(--carvao-900);margin-left:8px}

/* ===== Atividade operacional ===== */
.log-line{display:flex;gap:12px;padding:9px 0;border-bottom:1px dashed var(--borda-suave);font-size:13px}
.log-line:last-child{border-bottom:0}
.log-time{color:var(--cinza-400);white-space:nowrap;font-size:11.5px;margin-top:1px;font-variant-numeric:tabular-nums}
.log-msg{flex:1;color:var(--grafite-600)}
.log-msg b{color:var(--carvao-900)}
.tag{display:inline-block;padding:2px 8px;border-radius:4px;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.3px}
.tag.pm{background:#e8f1f4;color:var(--azul-petroleo)}
.tag.an{background:#f2f4f6;color:var(--grafite-500)}
.tag.es{background:#e8f3ec;color:var(--verde-operacional)}
.tag.qa{background:#fbf1e2;color:var(--ambar)}
.tag.ent{background:#e6ecfa;color:#34508c}

.rodape{max-width:1440px;margin:24px auto 40px;padding:0 20px;color:var(--cinza-400);font-size:11.5px;text-align:center;letter-spacing:.6px}
.rodape b{color:var(--grafite-500)}

.barra-status .btn-novo{background:var(--azul-petroleo);color:#fff;border:0;border-radius:6px;padding:6px 12px;font-size:12px;font-weight:700;cursor:pointer;transition:.15s;margin-left:6px}
.barra-status .btn-novo:hover{background:#14384a}
.hq-modal{position:fixed;inset:0;background:rgba(10,14,18,.62);display:none;align-items:center;justify-content:center;z-index:50}
.hq-modal.aberto{display:flex}
.hq-modal-box{background:#fff;border-radius:12px;width:min(560px,92vw);max-height:88vh;overflow:auto;padding:22px;box-shadow:0 18px 50px rgba(0,0,0,.35)}
.hq-modal-box h3{margin:0 0 4px;color:var(--grafite-700)}
.hq-modal-box .sub{color:var(--cinza-400);font-size:12px;margin-bottom:16px}
.hq-modal-box .fechar{float:right;background:none;border:0;font-size:22px;color:var(--cinza-400);cursor:pointer;line-height:1}
.hq-campo{margin-bottom:12px}
.hq-campo label{display:block;font-size:12px;font-weight:700;color:var(--grafite-500);margin-bottom:4px}
.hq-campo input,.hq-campo select,.hq-campo textarea{width:100%;padding:8px 10px;border:1px solid var(--borda);border-radius:7px;font-size:13px;color:var(--grafite-700);background:#fcfdfe;box-sizing:border-box;font-family:inherit}
.hq-campo textarea{min-height:84px;resize:vertical}
.hq-modal-acts{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
.hq-modal-acts button{border-radius:7px;padding:8px 16px;font-size:13px;font-weight:700;cursor:pointer}
.hq-cancel{background:#fff;border:1px solid var(--borda);color:var(--grafite-500)}
.hq-create{background:var(--azul-petroleo);border:1px solid var(--azul-petroleo);color:#fff}
.hq-danger{background:#fff;border:1px solid #e2b6af;color:#b34a3d}
.hq-msg{margin-top:10px;font-size:12.5px;font-weight:600}
.hq-msg.ok{color:#1b7f4d}.hq-msg.err{color:#b34a3d}
.cell-acoes{white-space:nowrap}
.cell-acoes button{border:1px solid var(--borda);background:#f9fafb;border-radius:6px;padding:4px 9px;font-size:11.5px;font-weight:700;cursor:pointer;color:var(--grafite-500);margin-left:4px;transition:.15s}
.cell-acoes button:hover{border-color:var(--azul-petroleo);color:var(--azul-petroleo)}
.cell-acoes button.del:hover{border-color:#b34a3d;color:#b34a3d}
.estr-toolbar{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end}
.estr-toolbar .hq-campo{flex:1;min-width:200px;margin-bottom:0}
.estr-lanca{flex:0 0 auto}
.estr-lanca button{background:var(--azul-petroleo);color:#fff;border:0;border-radius:8px;padding:10px 18px;font-size:13px;font-weight:700;cursor:pointer}
.estr-lanca button:hover{background:#14384a}
.estr-config{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.estr-config input{flex:1;min-width:160px;padding:8px 10px;border:1px solid var(--borda);border-radius:7px;font-size:12.5px;background:#fcfdfe}
.estr-config button{background:#eef3f6;border:1px solid var(--borda);border-radius:7px;padding:8px 12px;font-size:12.5px;font-weight:700;cursor:pointer;color:var(--grafite-600)}
.estr-status-item{border:1px solid var(--borda);border-radius:10px;padding:12px 14px;margin-bottom:10px;background:#fcfdfe}
.estr-status-item .l1{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
.estr-status-item .l1 b{font-size:14px;color:var(--grafite-700)}
.estr-status-item .barra{height:6px;border-radius:4px;background:#eef1f4;overflow:hidden;margin:8px 0}
.estr-status-item .barra i{display:block;height:100%;background:var(--azul-petroleo);transition:width .3s}
.estr-status-item pre{white-space:pre-wrap;font-size:11.5px;color:var(--cinza-400);max-height:150px;overflow:auto;margin:0}
.chip.fase{font-size:10.5px;padding:2px 8px;border-radius:20px;border:1px solid var(--borda);color:var(--grafite-500)}

@media(max-width:1100px){#layout{grid-template-columns:1fr}.kpis{grid-template-columns:repeat(2,1fr)}.grid-2{grid-template-columns:1fr}#topo{overflow-x:auto}nav{overflow-x:auto}}
@media(max-width:640px){.kpis{grid-template-columns:1fr}}
</style>
</head>
<body>

<header id="topo">
  <div class="topo-inner">
    <div class="marca">
      <img src="logo.png" alt="KRAEFEGG" class="logo-img">
      <div><b>KRAEFEGG <span>M.O.</span></b><small>Tech-AI &amp; Engineering Solutions</small></div>
    </div>
    <nav>
      <button class="ativo" data-pag="equipe">Equipe</button>
      <button data-pag="estrategia">Estratégia</button>
      <button data-pag="demandas">Demandas</button>
      <button data-pag="projetos">Projetos</button>
      <button data-pag="dossies">Dossiês</button>
      <button data-pag="agentes">Agentes</button>
      <button data-pag="subagentes">Subagentes</button>
      <button data-pag="clientes">Clientes</button>
      <button data-pag="relatorios">Relatórios</button>
      <button data-pag="credenciais">Credenciais</button>
    </nav>
    <div class="topo-acoes">
      <button class="icon-btn" id="btn-pesquisa" title="Pesquisar">⌕</button>
      <button class="icon-btn" id="btn-notif" title="Notificações" style="position:relative">◔<span class="badge">4</span></button>
      <button class="icon-btn" id="btn-config" title="Configurações">⚙</button>
      <button id="cta-perfil"><span class="avatar">RA</span><span><b>Railson Arruda</b><small>Diretoria Técnica</small></span></button>
    </div>
  </div>
</header>

<div id="layout">
  <div id="lateral">
    <aside id="menu-lateral"></aside>
    <div class="acoes-rapidas">
      <h3>Tarefas rápidas</h3>
      <button onclick="abrirNovaDemanda()">+ Nova Demanda</button>
      <button onclick="goPag('projetos')">+ Novo Projeto</button>
      <button onclick="goPag('dossies')">+ Novo Dossiê</button>
      <button onclick="goPag('clientes')">+ Novo Cliente</button>
      <button onclick="goPag('relatorios')">+ Relatório</button>
    </div>
  </div>
  <main id="conteudo"></main>
</div>

<footer class="rodape">KRAEFEGG M.O. — TECH-AI &amp; ENGINEERING SOLUTIONS · MINING · ENERGY · ENVIRONMENTAL · SISTEMA MULTIAGENTE · © 2026</footer>

<div class="hq-modal" id="modal-demanda">
  <div class="hq-modal-box">
    <button class="fechar" onclick="fecharModal()" aria-label="Fechar">×</button>
    <h3 id="md-titulo">Nova Demanda</h3>
    <div class="sub">As demandas ficam no Supabase e são despachadas à equipe de agentes (HQ M.O.).</div>
    <form onsubmit="salvarDemanda(event)">
      <input type="hidden" id="nd-id">
      <div class="hq-campo"><label>Código</label><input id="nd-cod" placeholder="Ex.: D-22"></div>
      <div class="hq-campo"><label>Título *</label><input id="nd-titulo" required placeholder="Descreva a demanda"></div>
      <div class="hq-campo"><label>Prompt / Descrição para o agente</label><textarea id="nd-prompt" placeholder="Instruções detalhadas para a equipe de agentes..."></textarea></div>

/* ================= Digital Twin (SVG isométrico) ================= */
function twinSvg(dep) {
  const base = 300, altura = 140;
  const points = (x,y,w,h) => `${x},${y} ${x+w},${y} ${x+w-h*0.0},${y} ...`;
  // faces isométricas simples por bloco
  let blocos = '';
  DEPARTAMENTOS.forEach((d,i)=>{
    const col = i % 5, row = Math.floor(i/5);
    const x = 50 + col*110, y = 40 + row*108;
    const w=104, h=80, prof=26, cor=d.cor, ativo = dep===d.id;
    const op = ativo ? '1' : '0.82';
    blocos += `
      <g class="dept-hover ${ativo?'ativo':''}" data-dept="${d.id}">
        <polygon points="${x},${y} ${x+w},${y} ${x+w},${y+h} ${x},${y+h}" fill="${cor}" opacity="${op}" stroke="#fff" stroke-width="1.5"/>
        <polygon points="${x},${y} ${x+w},${y} ${x+w-prof*0.7},${y-prof*0.6} ${x-prof*0.7},${y-prof*0.6}" fill="${cor}" opacity="${Number(op)*0.75}" stroke="#fff" stroke-width="1.2"/>
        <polygon points="${x},${y} ${x-prof*0.7},${y-prof*0.6} ${x-prof*0.7},${y+h-prof*0.6} ${x},${y+h}" fill="${cor}" opacity="${Number(op)*0.6}" stroke="#fff" stroke-width="1.2"/>
        <rect class="dept-tag" x="${x-8}" y="${y+40}" width="${w+16}" height="24" rx="5" fill="rgba(20,24,28,.82)" stroke="#fff"/>
        <text class="lbl-txt" x="${x+w/2}" y="${y+56}" text-anchor="middle" fill="#fff" font-size="11" font-weight="700" font-family="Segoe UI">${d.sigla}</text>
      </g>`;
  });
  return `<svg viewBox="0 0 640 300" role="img" aria-label="Digital Twin do escritório KRAEFEGG M.O.">
    <defs><linearGradient id="chao" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2a323a"/><stop offset="1" stop-color="#171b20"/></linearGradient></defs>
    <rect x="0" y="0" width="640" height="300" fill="url(#chao)"/>
    <text x="24" y="30" fill="#9aa5af" font-size="13" font-family="Segoe UI" font-weight="600">Digital Twin — Escritório Corporativo KRAEFEGG M.O.</text>
    <text x="24" y="48" fill="#55606b" font-size="11" font-family="Segoe UI">Clique em um departamento para inspecionar o Digital Twin</text>
    ${blocos}
  </svg>`;
}

function estrSalvarConfig(){
  localStorage.setItem('estr_url', document.getElementById('estr-url').value.trim());

async function estrLancar(){
  const c = STRAT_CFG(); const ideia = document.getElementById('estr-ideia').value.trim();
  const msg = document.getElementById('estr-msg');
  if(!ideia){ msg.textContent = 'Descreva a ideia/demanda.'; msg.style.color='#b34a3d'; return; }
  if(!c.token){ msg.textContent = 'Informe o token de acesso e salve a conexão.'; msg.style.color='#b34a3d'; return; }
  const codigo = document.getElementById('estr-codigo').value.trim() || ('S-'+Date.now().toString(36).toUpperCase());
  msg.textContent = '💡 Demandando ao CEO… (execução em nuvem pode levar alguns minutos)'; msg.style.color = '#1565c0';
  try{
    const r = await fetch(c.url + '/demanda', { method:'POST', headers:{ 'Content-Type':'application/json','X-HQ-Token':c.token },
      body: JSON.stringify({ ideia, codigo, titulo: ideia.slice(0,60) }), signal: AbortSignal.timeout(30000) });
    const j = await r.json().catch(()=>({}));
    if(!r.ok){ msg.textContent = 'Erro: ' + (j.erro||r.status); msg.style.color='#b34a3d'; return; }
    msg.textContent = '✓ ' + (j.msg||'Demanda aceita') + ' · código ' + j.codigo; msg.style.color = '#2e7d32';
    document.getElementById('estr-codigo').value = j.codigo;
    estrCarregarStatus();
  }catch(e){ msg.textContent = 'Falha de conexão: ' + e.message; msg.style.color='#b34a3d'; }
}

async function estrCarregarStatus(){
  const c = STRAT_CFG();
  const box = document.getElementById('estr-status'); if(!box) return;
  if(!c.url || !c.token){ box.innerHTML = '<div style="color:var(--cinza-400);font-size:13px">Configure URL e token acima para consultar.</div>'; return; }
  try{
    const r = await fetch(c.url + '/demandas', { headers:{ 'X-HQ-Token': c.token }, signal: AbortSignal.timeout(30000) });
    if(!r.ok) throw new Error('HTTP ' + r.status);
    ESTR_DEMANDAS = await r.json();
    renderEstrategiaStatus(box);
  }catch(e){ box.innerHTML = '<div style="color:#b34a3d;font-size:13px">Falha ao consultar backend: ' + e.message + '</div>'; }
}

async function estrCarregarLog(codigo){
  const c = STRAT_CFG();
  const box = document.getElementById('estr-status'); if(!box) return;
  try{
    const r = await fetch(c.url + '/demanda/' + codigo, { headers:{ 'X-HQ-Token': c.token }, signal: AbortSignal.timeout(30000) });
    const j = await r.json();
    if(!r.ok) throw new Error(j.erro||'HTTP '+r.status);
    renderEstrategiaStatus(box, j);
  }catch(e){ alert('Falha ao consultar log: ' + e.message); }
}

/* Despacha/reativa uma demanda existente no fluxo CEO/Conselho (backend estratégico).
   O POST /demanda com codigo existente NÃO recria: apenas dispara executar(codigo). */
async function estrAtivar(codigo, titulo){
  const c = STRAT_CFG();
  const box = document.getElementById('estr-status'); if(!box) return;
  if(!c.url || !c.token){ alert('Configure URL e token na página Estratégia (campo "Salvar conexão").'); return; }
  if(!confirm('Despachar a demanda ' + codigo + ' para o CEO/Conselho agora? (execução em nuvem leva alguns minutos)')) return;
  const btn = event && event.target; if(btn){ btn.disabled = true; btn.textContent = 'Despachando…'; }
  try{
    const r = await fetch(c.url + '/demanda', { method:'POST', headers:{ 'Content-Type':'application/json','X-HQ-Token': c.token },
      body: JSON.stringify({ ideia:'Reativar demanda '+codigo+': '+(titulo||codigo), codigo, titulo: titulo||codigo }), signal: AbortSignal.timeout(30000) });
    const j = await r.json().catch(()=>({}));
    if(!r.ok){ alert('Erro: ' + (j.erro||r.status)); if(btn){ btn.disabled=false; btn.textContent='▶ Ativar'; } return; }
    if(btn){ btn.disabled=false; btn.textContent='✓ Despachada'; }
    estrCarregarStatus();
  }catch(e){ alert('Falha de conexão: ' + e.message); if(btn){ btn.disabled=false; btn.textContent='▶ Ativar'; } }
}

function renderEstrategiaStatus(box, um){
  const lista = um ? [um] : ESTR_DEMANDAS;
  if(!lista || !lista.length){ box.innerHTML = '<div style="color:var(--cinza-400);font-size:13px">Nenhuma demanda estratégica ainda.</div>'; return; }
  box.innerHTML = lista.map(d=>{
    const pr = d.progresso || 0;
    const concluida = pr >= 100 || d.fase === 'concluida';
    const falha = d.fase === 'falha';
    const tit = String(d.titulo||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/'/g,'&#39;');
    const log = (um && d.log) ? d.log : (d.log || d.descricao || '');
    const estado = concluida ? '<span style="color:#2e7d32;font-weight:700">✓ Concluída</span>'
                 : falha    ? '<span style="color:#b34a3d;font-weight:700">✕ Falha — pode reativar</span>'
                 : '<span style="color:#1565c0;font-weight:700">🔄 Em produção</span>';
    let botoes = '';
    if(um) botoes += '<button onclick="estrCarregarLog(\'' + d.codigo + '\')" style="background:#eef3f6;border:1px solid var(--borda);border-radius:6px;padding:4px 10px;font-size:11.5px;font-weight:700;cursor:pointer;margin-bottom:6px">↻ Atualizar log</button>';
    if(!concluida){
      const corB = falha ? '#fdebeb' : '#e8f3ee';
      const corT = falha ? '#b34a3d' : '#2e7d32';
      const rot  = falha ? '↻ Reativar' : '▶ Ativar/Despachar';
      botoes += '<button onclick="estrAtivar(\'' + d.codigo + '\',\'' + tit + '\')" style="background:' + corB + ';color:' + corT + ';border:1px solid ' + (falha?'#e5b8b2':'#bfe3d2') + ';border-radius:6px;padding:4px 10px;font-size:11.5px;font-weight:700;cursor:pointer;margin-bottom:6px">' + rot + '</button>';
    }
    return '<div class="estr-status-item"><div class="l1"><b>' + d.codigo + ' · ' + tit + '</b>'
      + '<span>' + estado + ' <span class="chip fase">' + (STRAT_FASE[d.fase]||d.fase) + '</span> <b style="color:var(--azul-petroleo)">' + pr + '%</b></span></div>'
      + '<div class="barra"><i style="width:' + pr + '%"></i></div>'
      + botoes
      + '<pre>' + (''+log).replace(/</g,'&lt;') + '</pre></div>';
  }).join('');
}

function montaEstrategia(alvo){
  if(ESTR_INTERVAL) clearInterval(ESTR_INTERVAL);
  const tick = () => estrCarregarStatus();
  tick();
  ESTR_INTERVAL = setInterval(tick, 15000);
}

  else if(pag==='subagentes') alvo.innerHTML = paginaSubagentes();
  else if(pag==='clientes') alvo.innerHTML = paginaClientes();
  else if(pag==='relatorios') alvo.innerHTML = paginaRelatorios();
  else if(pag==='credenciais') alvo.innerHTML = paginaCredenciais();
  else alvo.innerHTML = paginaGenerica(pag);

  alvo.querySelectorAll('.dept-hover').forEach(g=>{
    g.addEventListener('click', ()=>{
      alvo.querySelectorAll('.dept-hover').forEach(x=>x.classList.remove('ativo'));
      g.classList.add('ativo');
      render();
    });
  });
}

    ['🏢','Visão Geral','visaogeral'],['▦','Digital Twin','digitaltwin'],['◔','Atividade Operacional','atividade'],

    `<div class="menu-item ${pag===CURRENT_PAG?'ativo':''}" data-nav="${pag}">
       <span class="mi-ico">${ic}</span>${label}</div>`).join('');

function proximoCodigo(){
  const usados = DEMANDAS.map(function(d){ return String(d.cod||''); });
  const nums = [];
  usados.forEach(function(c){ const m = /^D-(\d+)$/.exec(c); if(m) nums.push(+m[1]); });
  let n = (nums.length?Math.max.apply(null,nums):15) + 1;
  let cand = 'D-'+n;
  while(usados.indexOf(cand)>=0){ n++; cand='D-'+n; }
  return cand;
}

function reservarCodigo(){
  const API = 'https://mrqjmdfulmnggozwjxlq.supabase.co/rest/v1';
  const KEY = 'sb_publishable_PGW_hFT4bnzA_bIS8EPx6g_LvxWNP4Y';
  return fetch(API + '/demandas?select=codigo&limit=1000', { headers:{ 'apikey':KEY, 'Authorization':'Bearer '+KEY } })
    .then(function(r){ if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); })
    .then(function(rows){
      const usados = DEMANDAS.concat(Array.isArray(rows)?rows:[]).map(function(d){ return String(d.cod||d.codigo||''); });
      const nums = [];
      usados.forEach(function(c){ const m = /^D-(\d+)$/.exec(c); if(m) nums.push(+m[1]); });
      let n = (nums.length?Math.max.apply(null,nums):15) + 1;
      let cand = 'D-'+n;
      while(usados.indexOf(cand)>=0){ n++; cand='D-'+n; }
      return cand;
    });
}

function salvarDemanda(ev){
  ev.preventDefault();
  const msg = document.getElementById('nd-msg');
  msg.textContent=''; msg.className='hq-msg';
  const id = document.getElementById('nd-id').value;
  const codigo = document.getElementById('nd-cod').value.trim();
  const titulo = document.getElementById('nd-titulo').value.trim();
  const prompt = document.getElementById('nd-prompt').value.trim();
  const fase = document.getElementById('nd-fase').value;
  const prio = document.getElementById('nd-prio').value;
  const prog = Math.max(0, Math.min(100, +document.getElementById('nd-prog').value || 0));
  const resp = document.getElementById('nd-resp').value.trim();
  if(!codigo || !titulo || codigo==='calculando…') return;
  const API = 'https://mrqjmdfulmnggozwjxlq.supabase.co/rest/v1';
  const KEY = 'sb_publishable_PGW_hFT4bnzA_bIS8EPx6g_LvxWNP4Y';
  function tenta(cod){
    const payload = { codigo:cod, titulo:titulo, descricao:prompt||titulo, fase:fase, prioridade:prio, progresso:prog, responsavel:resp||null };
    const url = id ? (API + '/demandas?id=eq.' + id) : (API + '/demandas');
    const method = id ? 'PATCH' : 'POST';
    return fetch(url, { method:method, headers:{ 'apikey':KEY, 'Authorization':'Bearer '+KEY, 'Content-Type':'application/json' }, body: JSON.stringify(payload) })
      .then(function(r){
        if(r.status===409 && !id) return reservarCodigo().then(function(c2){ return tenta(c2); });
        if(!r.ok) throw new Error('HTTP '+r.status);
        return;
      });
  }
  tenta(codigo)
    .then(function(){
      msg.textContent = (id?'Demanda atualizada':'Demanda criada') + ' com sucesso.';
      msg.className = 'hq-msg ok';
      return carregarDemandas();
    })
    .then(function(){ if(CURRENT_PAG==='demandas') render(); })
    .then(function(){ setTimeout(fecharModal, 1100); })
    .catch(function(e){ msg.textContent = 'Erro: '+e.message; msg.className='hq-msg err'; });
}

function excluirDemanda(){
  const msg = document.getElementById('nd-msg');
  const id = document.getElementById('nd-id').value;
  msg.textContent=''; msg.className='hq-msg';
  if(!id){ msg.textContent='Nada a excluir.'; msg.className='hq-msg err'; return; }
  if(!confirm('Excluir a demanda ' + document.getElementById('nd-cod').value + '?')) return;
  const API = 'https://mrqjmdfulmnggozwjxlq.supabase.co/rest/v1';
  const KEY = 'sb_publishable_PGW_hFT4bnzA_bIS8EPx6g_LvxWNP4Y';
  fetch(API + '/demandas?id=eq.' + id, { method:'DELETE', headers:{ 'apikey':KEY, 'Authorization':'Bearer '+KEY } })
    .then(function(r){ if(!r.ok) throw new Error('HTTP '+r.status); })
    .then(function(){
      msg.textContent='Demanda excluída.'; msg.className='hq-msg ok';
      return carregarDemandas();
    })
    .then(function(){ if(CURRENT_PAG==='demandas') render(); })
    .then(function(){ setTimeout(fecharModal, 1100); })
    .catch(function(e){ msg.textContent='Erro ao excluir: '+e.message; msg.className='hq-msg err'; });
}
